# Push a tag like v0.2.0 (matching the version in tauri.conf.json): this builds the installer,
# signs the update files and opens a draft GitHub release with latest.json for the in-app updater.
# Secrets needed: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one).
#
# Optional, off until configured:
# - VirusTotal: with a VT_API_KEY secret, the installer is scanned and the release notes link the
#   report. The notes always get the installer's SHA-256.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BODY: Download `Krak_*_x64-setup.exe` below and run it. Already installed (Krak or Kryo Shard)? The app updates itself.

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Krak ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # VirusTotal (optional). The key never reaches the build: it is only given to these steps.
      - name: Is VirusTotal configured?
        id: vt-key
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: echo "present=$([ -n "$VT_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Scan the installer with VirusTotal
        id: virustotal
        if: steps.vt-key.outputs.present == 'true'
        # A VirusTotal outage never blocks a release: the notes then only have the checksum.
        continue-on-error: true
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          api=https://www.virustotal.com/api/v3
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          # Files over 32 MB go through a one-time upload URL.
          if [ "$(stat -c %s "$installer")" -gt 32000000 ]; then
            upload=$(curl --fail -sS -H "x-apikey: $VT_API_KEY" "$api/files/upload_url" | jq -r .data)
          else
            upload="$api/files"
          fi
          analysis=$(curl --fail -sS -H "x-apikey: $VT_API_KEY" -F "file=@$installer" "$upload" | jq -r .data.id)
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          # The free API allows 4 requests a minute: ask every 30 s, for 10 minutes at most.
          verdict="analysis still running when the release was drafted"
          for _ in $(seq 20); do
            sleep 30
            report=$(curl -sS -H "x-apikey: $VT_API_KEY" "$api/analyses/$analysis" || true)
            if [ "$(jq -r '.data.attributes.status // empty' <<< "$report")" = completed ]; then
              flagged=$(jq '.data.attributes.stats | .malicious + .suspicious' <<< "$report")
              engines=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<< "$report")
              verdict="$flagged of $engines engines flag it"
              break
            fi
          done
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Add the checksum and the scan to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VT_UPLOADED: ${{ steps.virustotal.outputs.uploaded }}
          VT_VERDICT: ${{ steps.virustotal.outputs.verdict }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          sha=$(sha256sum "$installer" | cut -d ' ' -f 1)
          marker='<!-- krak:checks -->'
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.body // ""' | tr -d '\r')
          # A re-run replaces what an earlier run added (and the blank lines before it).
          body=$(printf '%s' "${body%%"$marker"*}")
          {
            printf '%s\n\n%s\n' "$body" "$marker"
            printf '**SHA-256** of `%s`: `%s`\n' "$(basename "$installer")" "$sha"
            if [ "$VT_UPLOADED" = true ]; then
              printf '\n**VirusTotal:** [scan report](https://www.virustotal.com/gui/file/%s) (%s)\n' \
                "$sha" "${VT_VERDICT:-analysis still running when the release was drafted}"
            fi
          } > release-notes.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@release-notes.md > /dev/null
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
